services:
  # Option 1: Render Static Site (Fast, Free, Global CDN, SSL)
  - type: web
    name: stocksmart-static
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/stocksmart/browser
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Option 2: Render Node.js Web Service (Express Production Server)
  - type: web
    name: stocksmart-service
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
