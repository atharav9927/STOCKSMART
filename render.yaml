services:
  # Frontend: Render Static Site (Global CDN, SSL, Free)
  - type: web
    name: stocksmart-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/stocksmart/browser
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend: Spring Boot REST API (Java 21/25, JWT, JPA)
  - type: web
    name: stocksmart-api
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: stocksmart-db
          property: connectionString

# Cloud PostgreSQL Database
databases:
  - name: stocksmart-db
    databaseName: stocksmart
    user: stocksmart_user
    plan: free
